name: Deploy to Cloudflare Workers

# main → the `rdb` worker, live.
# dev  → a *version* of the `rdb-ms` worker published under the `dev` preview
#        alias, reachable at https://dev-rdb-ms.yazan-adnof.workers.dev
#
# `versions upload` is deliberate for dev: it publishes without taking
# production traffic, so the alias URL updates while rdb-ms's own
# rdb-ms.yazan-adnof.workers.dev keeps serving whatever was last `deploy`ed.
#
# Other branches do not deploy. The previous version of this file ran on '**'
# and created one worker per branch, named after a project that no longer
# exists — every run failed at `--env production`, because wrangler.toml
# declares no environments.

on:
  push:
    branches:
      - main
      - dev

concurrency:
  # A second push to the same branch cancels the first: two deploys racing to
  # the same worker is never what you want.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # postinstall runs scripts/sync-vendor.mjs, which populates public/vendor
      # (~43 MB of OpenCV + MediaPipe). It is gitignored, so the build depends on
      # this step having run.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # Worker name comes from wrangler.toml (`rdb`).
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # --name overrides wrangler.toml's `rdb` so dev lands on its own worker.
      # The KYC_WORKER service binding still resolves: rdb-ms and ramaaz-kyc are
      # both in the account the token is scoped to.
      - name: Upload dev preview
        if: github.ref == 'refs/heads/dev'
        run: npx wrangler versions upload --name rdb-ms --preview-alias dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Deployed → https://rdb.yazan-adnof.workers.dev"
          else
            echo "Uploaded → https://dev-rdb-ms.yazan-adnof.workers.dev"
          fi
